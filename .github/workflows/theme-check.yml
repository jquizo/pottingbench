# https://github.com/Shopify/theme-check-action
name: Theme Check

on:
  pull_request:
  push:
    branches: [main] # also catches theme editor commits

permissions:
  contents: read
  checks: write # check annotations on changed files

jobs:
  theme-check:
    name: Theme Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Theme Check
        uses: shopify/theme-check-action@v2
        with:
          token: ${{ github.token }}
          base: main # annotate only files changed against main, so vendor warnings stay quiet
          flags: '--fail-level error'
